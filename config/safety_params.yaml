/**:
  ros__parameters:
    velocity_gain: 5.0
    joint_velocity_limit: 1.0
    cartesian_velocity_limit: 1.0
    K_NULL: 0.1
    dls_lambda: 0.01             # base DLS damping
    dls_lambda_max: 0.05         # extra damping added near singularities
    singularity_threshold: 0.15  # smallest Jacobian singular value where extra damping starts (home ~0.22)
    singularity_sigma_stop: 0.04 # the arm slows down towards a singularity and stops at this singular value
    singularity_gain: 2.0        # [1/s] how fast it may approach sigma_stop (lower = slows down earlier)
    joint_limit_buffer: 0.15     # [rad] IK keeps joints this far away from their limits
    joint_limit_gain: 5.0        # [1/s] how fast a joint may approach the buffer (lower = slows down earlier)
    joint_limit_margin: 0.1    # [rad] hard clamp of the joint command inside the URDF limits
    max_spring_stretch: 0.2
    use_target_interpolation: true
    target_dt: 0.02 # 0.03333333333
    timer_dt: 0.005 # 0.03333333333
