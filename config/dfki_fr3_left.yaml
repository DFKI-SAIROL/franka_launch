robot_config:
  urdf_file: "robots/fr3/fr3.urdf.xacro"
  arm_id: "fr3"
  arm_prefix: "franka_left"
  gripper_type: "rh_p12_rn_a" # <franka_default|rh_p12_rn_a>
  arm_controller: "joint_impedance_controller" # <joint_impedance_controller|cartesian_impedance_controller>
  gripper_controller: "none"
  xyz: "-0.06 0.585 0"
  rpy: "0 0 0"
  xyz_ee: "0 0 0.0025"
  rpy_ee: "0 0 -0.785398"

  # Set on every launch; libfranka resets them on connect. Torques [Nm] joint1..7,
  # forces [N, N, N, Nm, Nm, Nm]. Above upper_* the arm stops with a reflex error.
  collision_behavior:
    lower_torque_thresholds_acceleration: [20.0, 20.0, 18.0, 18.0, 16.0, 14.0, 12.0]
    upper_torque_thresholds_acceleration: [20.0, 20.0, 18.0, 18.0, 16.0, 14.0, 12.0]
    lower_torque_thresholds_nominal: [20.0, 20.0, 18.0, 18.0, 16.0, 14.0, 12.0]
    upper_torque_thresholds_nominal: [20.0, 20.0, 18.0, 18.0, 16.0, 14.0, 12.0]
    lower_force_thresholds_acceleration: [40.0, 40.0, 40.0 ,50.0 ,50.0 ,50.0]
    upper_force_thresholds_acceleration: [40.0, 40.0, 40.0 ,50.0 ,50.0 ,50.0]
    lower_force_thresholds_nominal: [40.0, 40.0, 40.0 ,50.0 ,50.0 ,50.0]
    upper_force_thresholds_nominal: [40.0, 40.0, 40.0 ,50.0 ,50.0 ,50.0]
