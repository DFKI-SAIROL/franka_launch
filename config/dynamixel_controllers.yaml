# Joint names are arm-specific and injected at launch time by gripper.launch.py, so the
# `/**` wildcards match the gripper controller_manager under any arm namespace
# (/franka_left/gripper/..., /franka_right/gripper/...).
/**/controller_manager:
  ros__parameters:
    update_rate: 60  # Hz
    gripper_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/gripper_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    open_loop_control: true
