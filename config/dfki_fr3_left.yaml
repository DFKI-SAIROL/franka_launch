robot_config:
  urdf_file: "robots/fr3/fr3.urdf.xacro"
  arm_id: "fr3"
  arm_prefix: "franka_left"
  gripper_type: "rh_p12_rn_a" # <franka_default|rh_p12_rn_a>
  arm_controller: "joint_impedance_controller" # <joint_impedance_controller|cartesian_impedance_controller>
  gripper_controller: "none"
  xyz: "-0.034945 0.584947 -0.010072"
  rpy: "0.006052 -0.019344 -0.006069"
  xyz_ee: "0 0 0.0025"
  # End effector (gripper + wrist ZED) mounted on the flange at -pi/4 + pi, the same on both arms
  # (the right one used to be mounted the other way round, 2026-10-23). The ArUco board confirmed
  # this mount for the left camera (58 mm / ~8 deg from the right arm's view; others 50-85 cm off).
  rpy_ee: "0 0 2.356194490"
  cam_holder_yaw: "2.356194490"
  # Wrist holder: "short" = zed_holder_short.stl (2026-10-29), "default" = zed_holder.stl.
  camera_holder: "short"
  # Mount correction of the short holder: zero (nominal CAD pose) until the board calibration
  # (studio: Camera calibration) writes it. Calibrated values of the default holder:
  # cam_pos_x: "-0.056542"
  # cam_pos_y: "-0.013317"
  # cam_pos_z: "0.068738"
  # cam_roll: "0.498033"
  # cam_pitch: "0.454078"
  # cam_yaw: "0.132811"
  cam_pos_x: "-0.035815"
  cam_pos_y: "-0.033003"
  cam_pos_z: "0.019582"
  cam_roll: "-0.014302"
  cam_pitch: "-0.003317"
  cam_yaw: "0.016600"
